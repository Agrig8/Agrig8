name: Contract WASM Size Budget

on:
  pull_request:
    paths:
      - 'contracts/**'
  push:
    branches: [main]
    paths:
      - 'contracts/**'

concurrency:
  group: wasm-budget-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maximum allowed WASM size in bytes for the amana_escrow contract (issue #60).
  # Raise this value with a PR that explains why the increase is justified.
  WASM_SIZE_BUDGET_BYTES: 65536  # 64 KiB

jobs:
  wasm-size-check:
    name: WASM Size Budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build amana_escrow WASM (release)
        working-directory: contracts
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            -p amana_escrow 2>&1

      - name: Check WASM size against budget
        id: size-check
        working-directory: contracts
        run: |
          WASM_PATH=$(find target/wasm32-unknown-unknown/release -name "amana_escrow.wasm" | head -1)
          if [ -z "$WASM_PATH" ]; then
            echo "ERROR: amana_escrow.wasm not found after build"
            exit 1
          fi

          WASM_BYTES=$(wc -c < "$WASM_PATH")
          BUDGET=${{ env.WASM_SIZE_BUDGET_BYTES }}

          echo "wasm_bytes=$WASM_BYTES"    >> "$GITHUB_OUTPUT"
          echo "budget_bytes=$BUDGET"       >> "$GITHUB_OUTPUT"
          echo "wasm_path=$WASM_PATH"       >> "$GITHUB_OUTPUT"

          WASM_KB=$(( WASM_BYTES / 1024 ))
          BUDGET_KB=$(( BUDGET / 1024 ))
          echo "WASM size: ${WASM_BYTES} bytes (${WASM_KB} KiB) — budget: ${BUDGET} bytes (${BUDGET_KB} KiB)"

          if [ "$WASM_BYTES" -gt "$BUDGET" ]; then
            echo ""
            echo "❌ WASM size ${WASM_BYTES} B exceeds budget ${BUDGET} B (overage: $(( WASM_BYTES - BUDGET )) B)."
            echo "   Either reduce contract size or raise WASM_SIZE_BUDGET_BYTES with a justified PR comment."
            exit 1
          fi

          echo "✅ WASM size ${WASM_BYTES} B is within the ${BUDGET} B budget."

      - name: Comment size report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const bytes = '${{ steps.size-check.outputs.wasm_bytes }}';
            const budget = '${{ steps.size-check.outputs.budget_bytes }}';
            const pct = Math.round((parseInt(bytes) / parseInt(budget)) * 100);
            const icon = parseInt(bytes) <= parseInt(budget) ? '✅' : '❌';
            const body = [
              `## ${icon} WASM Size Report — \`amana_escrow\``,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| WASM size | ${(parseInt(bytes)/1024).toFixed(1)} KiB (${bytes} B) |`,
              `| Budget | ${(parseInt(budget)/1024).toFixed(1)} KiB (${budget} B) |`,
              `| Utilisation | ${pct}% |`,
              '',
              pct > 100
                ? `> **Over budget by ${parseInt(bytes) - parseInt(budget)} B.** Raise \`WASM_SIZE_BUDGET_BYTES\` in \`.github/workflows/contract-wasm-budget.yml\` with a justification comment if this increase is intentional.`
                : `> WASM is within budget.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('WASM Size Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
