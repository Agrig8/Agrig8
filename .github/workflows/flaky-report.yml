name: Flaky Test Weekly Report

on:
  # Weekly aggregation every Sunday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 0"

  # Manual trigger for ad-hoc reports
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "on-demand flake report"

jobs:
  # ─── Step 1: Validate the quarantine registry ─────────────────────────────
  validate-registry:
    name: Validate quarantine registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Validate quarantine registry
        run: node scripts/validate-flaky-quarantine.mjs

      - name: Post expired entries to step summary
        if: failure()
        run: |
          {
            echo "## ❌ Quarantine registry validation failed"
            echo ""
            echo "One or more entries in \`.github/flaky-tests-quarantine.json\` are expired or invalid."
            echo "Fix or extend them and push to unblock CI."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/validate-flaky-quarantine.mjs --allow-expired >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  # ─── Step 2: Generate weekly aggregation report ───────────────────────────
  weekly-report:
    name: Generate weekly flake report
    runs-on: ubuntu-latest
    needs: validate-registry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Download recent CI flake reports (last 7 days)
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309  # v28
        continue-on-error: true
        with:
          workflow: ci.yml
          name: flake-report-*
          path: reports/flake/ci-runs/
          if_no_artifact_found: warn

      - name: Generate weekly summary
        run: |
          mkdir -p reports/flake
          node scripts/flake-reporter.mjs \
            --report-dir reports/flake/ci-runs \
            --registry .github/flaky-tests-quarantine.json \
            --weekly-output reports/flake/weekly-summary.md

      - name: Post summary to GitHub step summary
        if: always()
        run: |
          if [ -f "reports/flake/weekly-summary.md" ]; then
            cat reports/flake/weekly-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Flaky Test Report" >> "$GITHUB_STEP_SUMMARY"
            echo "No flake data collected this week — no CI runs with JSON results found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload weekly report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: flake-weekly-report-${{ github.run_number }}
          path: |
            reports/flake/weekly-summary.md
            reports/flake/weekly-summary.json
          retention-days: 90

  # ─── Step 3: Enforce no expired quarantine entries ────────────────────────
  enforce-expiry:
    name: Enforce quarantine expiry
    runs-on: ubuntu-latest
    needs: validate-registry
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Check for expired entries (loud failure)
        run: |
          echo "Checking for expired quarantine entries..."
          node scripts/validate-flaky-quarantine.mjs
          echo "## ✅ No expired quarantine entries" >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate expired entries
        if: failure()
        run: |
          echo "::error file=.github/flaky-tests-quarantine.json::One or more quarantine entries are expired. Fix or extend them."
          echo "## ❌ Expired quarantine entries found" >> "$GITHUB_STEP_SUMMARY"
          echo "Run \`node scripts/validate-flaky-quarantine.mjs\` locally for details." >> "$GITHUB_STEP_SUMMARY"
