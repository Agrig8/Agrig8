name: slo-snapshot

on:
  schedule:
    # Mondays 09:00 UTC — feeds the weekly SLO review (docs/slo.md).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 20

      - name: Install tsx
        run: npx --yes tsx --version

      - name: Run SLO snapshot
        env:
          PROMETHEUS_URL: ${{ secrets.PROMETHEUS_URL }}
          SLO_SNAPSHOT_FILE: ${{ github.workspace }}/slo-snapshots/slo-snapshot.jsonl
        run: npx tsx scripts/slo-snapshot.ts

      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c  # v7.2.1
        with:
          commit_message: "chore: weekly SLO snapshot"
          file_pattern: slo-snapshots/slo-snapshot.jsonl
