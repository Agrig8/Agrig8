name: Mobile E2E — Nightly

on:
  schedule:
    # 02:00 UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:

# This workflow runs the Detox smoke suite on a nightly schedule and before
# production releases. It mirrors the mobile-e2e-ios / mobile-e2e-android
# jobs in ci.yml but always runs regardless of path filters.

jobs:
  mobile-e2e-ios-nightly:
    name: Nightly Smoke — iOS
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
        with:
          xcode-version: latest-stable

      - name: Expo prebuild (iOS)
        run: pnpm expo prebuild --platform ios --non-interactive
        env:
          CI: true

      - name: Build iOS app for simulator
        run: |
          xcodebuild \
            -workspace ios/Amana.xcworkspace \
            -scheme Amana \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=17.5" \
            build \
            | xcpretty --color
        env:
          CI: true

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | grep "17.5" | head -1 | grep -E -o '\([-A-F0-9]+\)' | tr -d '()')
          xcrun simctl boot "$UDID" || true

      - name: Run Detox smoke tests (iOS)
        run: pnpm test:e2e:ios
        env:
          CI: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-detox-ios-${{ github.run_id }}
          path: mobile/.detox-artifacts/
          retention-days: 14

  mobile-e2e-android-nightly:
    name: Nightly Smoke — Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4

      - name: Cache AVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-nightly-Pixel_6_API_34-${{ runner.os }}

      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo "no" | avdmanager create avd \
            --force \
            --name Pixel_6_API_34 \
            --abi google_apis/x86_64 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6"

      - name: Expo prebuild (Android)
        run: pnpm expo prebuild --platform android --non-interactive
        env:
          CI: true

      - name: Build Android APK (debug)
        run: |
          cd android && ./gradlew assembleDebug assembleAndroidTest -DtestBuildType=debug
        env:
          CI: true

      - name: Start emulator and run Detox smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6_API_34
          script: cd mobile && pnpm test:e2e:android
        env:
          CI: true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-detox-android-${{ github.run_id }}
          path: mobile/.detox-artifacts/
          retention-days: 14
