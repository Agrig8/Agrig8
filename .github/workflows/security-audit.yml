name: Security Audit

# Blocking dependency vulnerability gate + weekly full scan (issue #204).
# High/critical advisories fail the build unless covered by an unexpired waiver
# in .github/audit-waivers.json. Expired waivers also fail.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/security-audit.yml"
      - ".github/audit-waivers.json"
      - "scripts/check-audit-waivers.mjs"
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "contracts/**/Cargo.toml"
      - "contracts/Cargo.lock"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/security-audit.yml"
      - ".github/audit-waivers.json"
      - "scripts/check-audit-waivers.mjs"
      - "backend/package.json"
      - "backend/pnpm-lock.yaml"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "contracts/**/Cargo.toml"
      - "contracts/Cargo.lock"
  schedule:
    # Weekly full scan — Monday 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install deps (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit gate (${{ matrix.workspace }})
        run: node scripts/check-audit-waivers.mjs npm ${{ matrix.workspace }} ${{ matrix.workspace }}

  cargo-audit:
    name: cargo audit (contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Audit gate (contracts)
        run: node scripts/check-audit-waivers.mjs cargo contracts contracts

  weekly-report:
    name: Weekly full scan report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Generate report
        run: |
          mkdir -p security-reports
          {
            echo "# Weekly dependency audit — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for ws in backend frontend; do
              echo "## $ws (pnpm audit)"
              echo '```'
              (cd "$ws" && pnpm install --frozen-lockfile --ignore-scripts >/dev/null 2>&1 && pnpm audit --audit-level low) || true
              echo '```'
              echo
            done
            echo "## contracts (cargo audit)"
            echo '```'
            (cd contracts && cargo audit) || true
            echo '```'
          } | tee security-reports/audit-report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-audit-report
          path: security-reports/audit-report.md
          retention-days: 30
