name: Changelog Draft

# Manual only. Produces a DRAFT changelog artifact for maintainer review.
# It never commits, tags, or publishes a release.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Include PRs merged on or after this date (YYYY-MM-DD)"
        required: true
      version:
        description: "Version label for the draft heading"
        required: false
        default: "Unreleased"

permissions:
  contents: read
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate date input
        env:
          SINCE: ${{ inputs.since }}
        run: |
          if ! [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "since must be YYYY-MM-DD" >&2
            exit 1
          fi

      - name: Fetch merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        run: |
          gh pr list --state merged --limit 500 \
            --search "merged:>=${SINCE}" \
            --json number,title,url,labels > "$RUNNER_TEMP/prs.json"

      - name: Render draft
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/generate-changelog.mjs "$RUNNER_TEMP/prs.json" \
            --version "$VERSION" --out "$RUNNER_TEMP/CHANGELOG_DRAFT.md"

      - uses: actions/upload-artifact@v4
        with:
          name: changelog-draft
          path: ${{ runner.temp }}/CHANGELOG_DRAFT.md
          if-no-files-found: error
